<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Gold Wave</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- MAIN MENU -->
<div id="menu" class="screen">
  <div class="menu-left">
    <h1 class="title">GOLD<span>WAVE</span></h1>
    <button id="btnPlay" class="pixel-btn" data-i18n="play">PLAY</button>
    <button id="btnSettings" class="pixel-btn" data-i18n="settings">AYARLAR</button>
    <div class="menu-map-wrap">
      <div class="menu-map-label">MAP PREVIEW</div>
      <canvas id="menuMinimap" width="400" height="300"></canvas>
    </div>
  </div>
  <div class="menu-top-right">
    <input id="nameInput" maxlength="16" />
  </div>
  <div class="menu-right">
    <canvas id="charPreview" width="160" height="200"></canvas>
    <button id="btnWardrobe" class="wardrobe-btn" title="Kıyafet">
      <canvas id="shirtIcon" width="40" height="40"></canvas>
    </button>
    <div id="colorPalette" class="palette hidden"></div>
  </div>
</div>

<!-- ROOMS SCREEN -->
<div id="rooms" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm" data-i18n="rooms">ODALAR</h2>
    <button id="btnBack1" class="pixel-btn small" data-i18n="back">GERI</button>
    <button id="btnCreateRoom" class="pixel-btn" data-i18n="createRoom">ODA OLUSTUR</button>
    <div class="join-row">
      <input id="joinCode" data-i18n-ph="roomCode" placeholder="ODA KODU" maxlength="5"/>
      <button id="btnJoinCode" class="pixel-btn" data-i18n="join">KATIL</button>
    </div>
    <h3 class="title-sm" data-i18n="openRooms">AÇIK ODALAR</h3>
    <div id="roomList" class="room-list"></div>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm" data-i18n="lobby">LOBI</h2>
    <div><span data-i18n="roomCode2">Oda Kodu:</span> <span id="lobbyCode"></span></div>
    <div id="lobbyPlayers" class="lobby-players"></div>
    <button id="btnStart" class="pixel-btn hidden" data-i18n="start">BASLAT</button>
    <div id="waitMsg" class="hint" data-i18n="waitHost">Oda sahibinin baslatmasini bekle</div>
    <button id="btnLeave" class="pixel-btn small" data-i18n="leave">CIK</button>
  </div>
</div>

<!-- SETTINGS (menu) -->
<div id="settings" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm" data-i18n="settingsTitle">AYARLAR</h2>
    <label><span data-i18n="volume">Ses</span><input id="setVolume" type="range" min="0" max="100" value="50"/></label>
    <label><span data-i18n="crosshair">Crosshair</span><input id="setCross" type="checkbox" checked/></label>
    <div class="lang-row">
      <span data-i18n="language">Dil</span>
      <button id="btnLangTR" class="pixel-btn small lang-btn active-lang">TR</button>
      <button id="btnLangEN" class="pixel-btn small lang-btn">EN</button>
    </div>
    <button id="btnBack2" class="pixel-btn small" data-i18n="back">GERI</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="leaderboard" class="lb"></div>
    <div id="timer" class="timer">10:00</div>
    <div id="hpbar" class="hpbar"><div id="hpfill"></div></div>
    <div id="ammo" class="ammo"><span id="ammoCur">30</span><span class="max">/30</span></div>
    <div id="killfeed" class="killfeed"></div>
  </div>
  <div id="roundEnd" class="screen hidden overlay">
    <div class="panel">
      <h2 class="title-sm" data-i18n="roundEnd">TUR BITTI</h2>
      <div id="winnerLine"></div>
      <div id="finalBoard"></div>
      <div class="hint" data-i18n="nextRound">Yeni tur birazdan...</div>
    </div>
  </div>
  <div id="dead" class="dead hidden" data-i18n="eliminated">ELENDIN</div>
  <div id="pauseMenu" class="screen hidden overlay">
    <div class="panel">
      <h2 class="title-sm" data-i18n="settingsTitle">AYARLAR</h2>
      <label><span data-i18n="volume">Ses</span><input id="pauseVolume" type="range" min="0" max="100" value="50"/></label>
      <div class="lang-row">
        <span data-i18n="language">Dil</span>
        <button id="pauseLangTR" class="pixel-btn small lang-btn active-lang">TR</button>
        <button id="pauseLangEN" class="pixel-btn small lang-btn">EN</button>
      </div>
      <button id="btnResume" class="pixel-btn" data-i18n="resume">DEVAM ET</button>
      <button id="btnLeaveGame" class="pixel-btn" data-i18n="leaveGame">OYUNDAN CIK</button>
      <div class="hint" data-i18n="escHint">ESC ile kapatabilirsin</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
