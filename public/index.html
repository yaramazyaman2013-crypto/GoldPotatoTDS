<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>GoldPotato TDS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- MAIN MENU -->
<div id="menu" class="screen">
  <div class="menu-left">
    <h1 class="title">GOLD<span>POTATO</span><br/>TDS</h1>
    <button id="btnPlay" class="pixel-btn">PLAY</button>
    <button id="btnSettings" class="pixel-btn">AYARLAR</button>
  </div>
  <div class="menu-top-right">
    <input id="nameInput" maxlength="16" />
  </div>
  <div class="menu-right">
    <canvas id="charPreview" width="160" height="200"></canvas>
    <button id="btnWardrobe" class="wardrobe-btn" title="Kıyafet">
      <canvas id="shirtIcon" width="40" height="40"></canvas>
    </button>
    <div id="colorPalette" class="palette hidden"></div>
  </div>
</div>

<!-- ROOMS SCREEN -->
<div id="rooms" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm">ODALAR</h2>
    <button id="btnBack1" class="pixel-btn small">GERI</button>
    <button id="btnCreateRoom" class="pixel-btn">ODA OLUSTUR</button>
    <div class="join-row">
      <input id="joinCode" placeholder="ODA KODU" maxlength="5"/>
      <button id="btnJoinCode" class="pixel-btn">KATIL</button>
    </div>
    <h3 class="title-sm">AÇIK ODALAR</h3>
    <div id="roomList" class="room-list"></div>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm">LOBI</h2>
    <div>Oda Kodu: <span id="lobbyCode"></span></div>
    <div id="lobbyPlayers" class="lobby-players"></div>
    <button id="btnStart" class="pixel-btn hidden">BASLAT</button>
    <div id="waitMsg" class="hint">Oda sahibinin baslatmasini bekle</div>
    <button id="btnLeave" class="pixel-btn small">CIK</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen hidden">
  <div class="panel">
    <h2 class="title-sm">AYARLAR</h2>
    <label>Ses<input id="setVolume" type="range" min="0" max="100" value="50"/></label>
    <label>Crosshair<input id="setCross" type="checkbox" checked/></label>
    <button id="btnBack2" class="pixel-btn small">GERI</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="leaderboard" class="lb"></div>
    <div id="timer" class="timer">10:00</div>
    <div id="hpbar" class="hpbar"><div id="hpfill"></div></div>
    <div id="ammo" class="ammo"><span id="ammoCur">30</span><span class="max">/30</span></div>
    <div id="killfeed" class="killfeed"></div>
  </div>
  <div id="roundEnd" class="screen hidden overlay">
    <div class="panel">
      <h2 class="title-sm">TUR BITTI</h2>
      <div id="winnerLine"></div>
      <div id="finalBoard"></div>
      <div class="hint">Yeni tur birazdan...</div>
    </div>
  </div>
  <div id="dead" class="dead hidden">ELENDIN</div>
  <div id="pauseMenu" class="screen hidden overlay">
    <div class="panel">
      <h2 class="title-sm">AYARLAR</h2>
      <label>Ses<input id="pauseVolume" type="range" min="0" max="100" value="50"/></label>
      <button id="btnResume" class="pixel-btn">DEVAM ET</button>
      <button id="btnLeaveGame" class="pixel-btn">OYUNDAN CIK</button>
      <div class="hint">ESC ile kapatabilirsin</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
